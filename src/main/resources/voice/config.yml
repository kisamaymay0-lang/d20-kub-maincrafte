# Сообщения голосового описания. Поддерживается MiniMessage.
# Запись всегда длится 30 секунд, сохраняется автоматически и только после успешной записи файла/профиля.
messages:
  prompt: 'Напиши новое описание в чат, или: «отмена» — для отмены; «запись» — для записи голосового сообщения вместо описания. Сообщение не публикуется в чате'
  started: 'Запись началась! Идёт она 30 секунд, мы уведомим о конце.'
  saved: '<green>Запись сохранена!</green>'
  save-failed: '<red>Не удалось сохранить запись.</red>'
  start-failed: '<red>Не удалось начать запись.</red>'
  unavailable: '<red>Не удалось начать действие. Plasmo Voice 2.x недоступен на сервере.</red>'
  no-client: '<red>Нужно подключение Plasmo Voice на клиенте. Проверьте мод и голосовое соединение.</red>'
  disabled: '<red>Включите голосовой чат в настройках Plasmo Voice.</red>'
  microphone-muted: '<red>Микрофон выключен в Plasmo Voice. Запись не сохранена.</red>'
  server-muted: '<red>Запись недоступна: голосовой чат отключён для вас администратором.</red>'
  busy: '<gray>Сейчас заняты все места записи. Попробуйте немного позже.</gray>'
  already-recording: '<gray>Запись уже идёт. Дождитесь окончания или напишите «отмена».</gray>'
  recording-hint: '<gray>Говорите через Plasmo Voice обычной клавишей разговора. Запись закончится через 30 секунд после начала. «отмена» отменяет запись.</gray>'
  cancelled: '<gray>Запись отменена. Прежнее описание сохранено.</gray>'
  no-audio: '<red>Не удалось сохранить запись. Голосовые кадры не поступали — проверьте микрофон и клавишу разговора.</red>'
  bad-audio: '<red>Не удалось сохранить запись. Ошибка голосовых данных.</red>'
  format-changed: '<red>Не удалось сохранить запись. Формат микрофона изменился во время записи.</red>'
  missing: '<gray>У этого профиля нет голосового описания.</gray>'
  playing: '<gray>Воспроизведение началось. Нажмите ещё раз, чтобы остановить.</gray>'
  stopped: '<gray>Воспроизведение остановлено.</gray>'
  finished: '<gray>Воспроизведение завершено.</gray>'
  play-failed: '<red>Не удалось воспроизвести запись.</red>'
