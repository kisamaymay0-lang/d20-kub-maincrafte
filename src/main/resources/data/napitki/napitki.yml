# Бочковые напитки: сколько варится, сколько лет до какого качества и что написано
# в подсказке бутылочки.
# Файл лежит в папке плагина: plugins/f8-plugin/data/napitki/napitki.yml
# Применяется командой /f8 reload — перезапуск не нужен.
#
# ── ЧТО ЗДЕСЬ ───────────────────────────────────────────────────────────────
# Файл отвечает ТОЛЬКО за бочку: рецепт (что положить) и внешний вид напитка
# остались в settings/recipe-poilo.yml. Здесь — сроки выдержки, ступени качества
# и тексты в подсказке.
#
# Раздел default — общие настройки. Их берёт любой напиток, у которого в drinks
# нет своих. Напиток может переписать любое поле или весь список.
#
#   brew-ticks:       сколько тиков бродит закладка (20 тиков = 1 секунда).
#                     200 — это 10 секунд;
#   bottles:          сколько бутылочек выходит из одной закладки (не больше 9 —
#                     столько бочка держит);
#   ticks-per-year:   сколько тиков идёт один год выдержки.
#                     24000 — сутки в Minecraft, то есть 1 год = 1 игровые сутки;
#   quality:          ступени качества. У каждой:
#                       tier:        номер ступени, 1 — самое плохое (по нему
#                                    считаются штрафы за переливания);
#                       name:        надпись в подсказке;
#                       color:       цвет надписи: '#RRGGBB' или red/yellow/green…;
#                       gradient:    необязательный второй цвет — надпись станет
#                                    переливом от color к gradient;
#                       bold:        жирная надпись (true/false, необязательно);
#                       underline:   подчёркнутая надпись (true/false);
#                       description: что написать про это качество;
#   years:            до какого года какая ступень. «up-to-years» входит в срок,
#                     -1 или '*' — «и дальше, без границы». У года можно написать
#                     своё description — оно важнее описания ступени;
#   quality-description: одно описание сразу на все ступени. Так у вин пока стоит
#                     прочерк «—» вместо настоящих описаний: поменяйте строку —
#                     поменяется подсказка у всего вина.
#
# ── ШТРАФ ЗА ПЕРЕЛИВАНИЯ ────────────────────────────────────────────────────
# Чем больше раз напиток переливали, тем ниже ступень:
#   0–1 переливание   — как есть;
#   2–3 переливания   — на ступень ниже (но не ниже 2-й);
#   4–5 переливаний   — на две ступени ниже (но не ниже 2-й);
#   6 и больше        — не выше 2-й ступени.
#
# ── СЕЙЧАС В ФАЙЛЕ ──────────────────────────────────────────────────────────
#   pirate_rum   Пиратский ром    свои годы и описания (как было зашито в код)
#   wine         Вино            годы и качества как у рома, описания — прочерк
#   sweet_wine   Сладкое вино    то же
#   white_wine   Белое вино      то же
#   bitter_wine  Горькое вино    то же
default:
  brew-ticks: 200
  bottles: 3
  ticks-per-year: 24000

  quality:
    - tier: 1
      name: 'Ужасное! ☠'
      color: '#FF5555'
      description: 'Молодой сивушный спирт. Обжигает горло.'
    - tier: 2
      name: 'Странное...'
      color: '#FFA500'
      description: 'Вкус еще только формируется...'
    - tier: 3
      name: 'Хорошее ☺'
      color: '#FFFF55'
      bold: true
      description: 'Добротный пиратский ром, пик для будней на корабле!'
    - tier: 4
      name: 'Идеальное! ☀'
      color: '#55FF55'
      bold: true
      underline: true
      description: 'Ром идеален, вкус приятно чешет горло.'
    - tier: 5
      name: 'БЕЗУПРЕЧНОЕ!!1'
      color: '#FFFFFF'
      gradient: '#FFFF55'
      bold: true
      underline: true
      description: 'Теперь ты можешь называть себя настоящим пиратом!'

  years:
    - up-to-years: 1
      tier: 1
    - up-to-years: 3
      tier: 2
    - up-to-years: 5
      tier: 3
    - up-to-years: 9
      tier: 4
    - up-to-years: 10
      tier: 5
    - up-to-years: 13
      tier: 3
      description: 'Передержали. Ром становится горьким и древесным'
    - up-to-years: '*'
      tier: 2
      description: 'Уже не ром, а жидкость со вкусом старой доски.'

drinks:
  # Пиратский ром: всё как в default — этот раздел оставлен, чтобы было видно,
  # где менять ром, если захочется свои сроки только для него.
  pirate_rum: {}

  # ── ВИНА ──────────────────────────────────────────────────────────────────
  # Годы качества и переливания у вин как у рома — их не переписываем.
  # Описания — заглушка: настоящие тексты появятся позже, поменяйте строку
  # quality-description (или уберите её и напишите description у ступеней выше).
  wine:
    quality-description: '—'
  sweet_wine:
    quality-description: '—'
  white_wine:
    quality-description: '—'
  bitter_wine:
    quality-description: '—'
