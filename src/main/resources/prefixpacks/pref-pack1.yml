# Пак префиксов. Рабочая папка плагина:
#   plugins/f8-plugin/prefixpacks/
# (при первом запуске этот файл копируется из jar; применить правки —
#   /profile prefix reload , перезапуск не нужен.)
#
# Пак — это кейс со своим набором префиксов. В меню префиксов он виден
# сундучком: на нём название пака и сколько таких кейсов лежит у игрока.
# Вскрытие достаёт один префикс из набора — тот, которого у игрока ещё нет.
#
#   name       — название пака (на сундучке в меню);
#   time-hours — срок кейса в ЧАСАХ с момента выдачи;
#                -1 — бессрочный кейс, он никогда не сгорает;
#   prefixes   — свои префиксы пака (не ссылки на prefixes.yml):
#       name  — название префикса (в меню и в кейсе);
#       file  — иконка из ресурспака: items/<file>.json и textures/item/<file>.png
#               (комплект pref1…pref10; свои картинки кладите рядом);
#       color — необязательно: цвет названия префикса;
#       id    — необязательно: техническое имя (по умолчанию —
#               <имя пака>_<file>, например pref-pack1_pref1).
#
# Срок кейса — это срок, пока кейс лежит у игрока. Префикс, выпавший из кейса,
# остаётся у игрока навсегда: забрать его можно только командой администратора.
#
# Выдать кейсы пака:      /profile case pack give <ник> pref-pack1 [число]
# Забрать кейсы пака:     /profile case pack take <ник> pref-pack1 [число]
# Сколько кейсов у игрока: /profile case pack list <ник>

name: 'Тестовый пак'

time-hours: -1

prefixes:
  - name: 'Морозный'
    file: pref1
    color: '#8FE3F5'
  - name: 'Закалённый'
    file: pref2
    color: '#B9C3CE'
  - name: 'Звездочёт'
    file: pref3
    color: '#C0A6FF'
  - name: 'Аврора'
    file: pref9
    color: '#7FF0D2'
