# Пак префиксов: plugins/f8-plugin/prefixpacks/pref-pack1.yml
# Изменения применяются командами /profile prefix reload или /f8 reload.
# В prefixes перечислены ТОЛЬКО файлы из plugins/f8-plugin/prefixes.yml.
# Имя, цвет, номер и id каждого префикса берутся из prefixes.yml, а не
# копируются в пак. Один и тот же префикс не выпадет повторно из другого кейса.
# name — название пака в меню; time-hours — срок жизни кейса от выдачи
# (не срок выбитого префикса); -1 — бессрочный кейс.
# Уже существующий файл пака при обновлении jar не перезаписывается.
name: 'Тестовый пак'
time-hours: -1
prefixes:
  - pref1
  - pref2
  - pref3
  - pref9
