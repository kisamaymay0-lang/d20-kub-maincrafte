# Пак префиксов. Рабочая папка плагина:
#   plugins/f8-plugin/prefixpacks/
# (при первом запуске этот файл копируется из jar; применить правки —
#   /profile prefix reload или /f8 reload , перезапуск не нужен.)
#
# Пак — это кейс со своим набором префиксов. В меню префиксов он виден
# сундучком: нажмите на пак — увидите, что внутри (сверху и снизу), и посередине
# кнопку «Крутить кейс пака». Вскрытие достаёт один префикс из набора — тот,
# которого у игрока ещё нет.
#
#   name       — название пака (на сундучке в меню);
#   time-hours — срок кейса в ЧАСАХ с момента выдачи,
#                -1 — бессрочный кейс, он никогда не сгорает;
#   prefixes   — ФАЙЛЫ префиксов из prefixes.yml (plugins/f8-plugin/prefixes.yml):
#       имя, цвет и номер префикса берутся оттуда же, по полю file.
#       Запись — это просто файл:      - pref1
#       или то же полем:               - file: pref1
#       имя и цвет можно переопределить на месте:
#                                     - file: pref3
#                                       name: 'Своё имя'
#                                       color: '#C0A6FF'
#       id писать не нужно: префикс остаётся тем же, что и в prefixes.yml.
#       Если файла в prefixes.yml нет, пак заводит свой префикс (id <пак>_<файл>),
#       а в журнал сервера уходит предупреждение.
#
# Срок кейса — это срок, пока кейс лежит у игрока. Префикс, выпавший из кейса,
# остаётся у игрока навсегда: забрать его можно только командой администратора.
#
# Выдать кейсы пака:       /profile case pack give <ник> pref-pack1 [число]
# Забрать кейсы пака:      /profile case pack take <ник> pref-pack1 [число]
# Сколько кейсов у игрока: /profile case pack list <ник>

name: 'Тестовый пак'

time-hours: -1

prefixes:
  - pref1
  - pref2
  - pref3
  - pref9
