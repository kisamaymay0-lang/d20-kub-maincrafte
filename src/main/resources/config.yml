# ============================================
# AdaptationPlugin - Конфигурация
# ============================================

settings:
  # ===== ЗАЩИТА =====
  # Защита за каждый предмет брони с чаром "Адаптация"
  # Полный сет (4 предмета): 4 * 0.075 = 0.30 (30% защиты)
  normal-protection-per-piece: 0.075
  
  # Защита за каждый предмет при супер-адаптации
  # Полный сет (4 предмета): 4 * 0.125 = 0.50 (50% защиты)
  super-protection-per-piece: 0.125

  # ===== ШТРАФЫ =====
  # Штраф за каждый предмет при НЕсовпадающем типе урона (обычная адаптация)
  # Полный сет (4 предмета): 4 * 0.10 = 0.40 (+40% урона)
  penalty-per-piece: 0.10
  
  # Штраф за каждый предмет при НЕсовпадающем типе урона (супер-адаптация)
  # Полный сет (4 предмета): 4 * 0.125 = 0.50 (+50% урона)
  super-penalty-per-piece: 0.125

  # ===== БОНУСЫ ЗА ПОЛУЧЕНИЕ УРОНА =====
  # На сколько увеличивается время адаптации при получении урона (в секундах)
  hit-bonus-normal: 0.2
  hit-bonus-super: 0.4

  # ===== ДЛИТЕЛЬНОСТЬ =====
  # Сколько секунд длится адаптация
  duration-normal: 10
  duration-super: 4

  # ===== КУЛДАУН =====
  # Сколько секунд длится перезарядка после окончания адаптации
  cooldown-normal: 2
  cooldown-super: 4

  # ===== ТРЕБОВАНИЯ ДЛЯ АКТИВАЦИИ =====
  # Сколько попаданий одного типа нужно получить, чтобы активировать адаптацию
  required-hits:
    lvl1: 10   # Средний уровень чара на броне < 1.5
    lvl2: 8    # Средний уровень чара на броне 1.5 - 2.5
    lvl3: 6    # Средний уровень чара на броне > 2.5

  # Сколько попаданий нужно получить ВО ВРЕМЯ адаптации, чтобы активировать супер-адаптацию
  required-super-hits: 8
