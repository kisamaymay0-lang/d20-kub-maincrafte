settings:
  normal-protection-per-piece: 0.075
  super-protection-per-piece: 0.125
  penalty-per-piece: 0.10
  super-penalty-per-piece: 0.125
  hit-bonus-normal: 0.2      # 0.2 секунды за удар в обычной адаптации
  hit-bonus-super: 0.4       # 0.4 секунды за удар в суперадаптации
  duration-normal: 10
  duration-super: 4
  cooldown-normal: 2
  cooldown-super: 4
  # Интервал действует на набор, продление и повышение адаптации.
  # Миллисекунды пересчитываются в игровые тики с округлением вверх
  # (50 мс = 1 тик при 20 TPS), как и таймер эффекта. Защита не прерывается.
  # Нулевые/отрицательные интервалы заменяются безопасными значениями по умолчанию.
  # Минимальный интервал между засчитываемыми ударами (в миллисекундах)
  damage-interval-normal-ms: 450
  # Для огня/лавы/удушья интервал длиннее, иначе адаптация заполняется слишком быстро
  damage-interval-environment-ms: 2000
  required-hits:
    lvl1: 10
    lvl2: 8
    lvl3: 6
  required-super-hits: 8
  # Настройки чара "Откат I"
rollback:
  # Количество секунд, на которые откатывается игрок
  history-seconds: 5
  
  # Интервал сохранения позиций (в тиках, 20 = 1 секунда)
  # 10 = 0.5 секунды (для точности)
  save-interval-ticks: 10
  
  # Эффекты после телепортации
  effects:
    blindness-duration: 40   # в тиках (40 = 2 секунды)
    slowness-duration: 60    # в тиках (60 = 3 секунды)
    slowness-level: 1
    confusion-duration: 60   # в тиках

# Икра (шифт + ПКМ по треске/лососю)
caviar:
  # Шанс найти икру в рыбе (в процентах). Редкий, но возможный.
  chance-percent: 12
  # Максимальное количество икры за раз
  max-amount: 8

# Созвездия (видны с 13000 до 23000 тиков, только в обычном мире)
constellations:
  # Небесная сфера без инерции: координаты глаз обновляются каждый тик.
  # Весь рисунок медленно вращается по времени, независимо от поворота камеры.
  # Сфера отодвигается при достаточной дальности клиента с сохранением углового размера.
  # Масштаб ограничен обычным туманом чанков; до звёзд нельзя дойти.
  # Визуальное расстояние до звёзд (4..256 блоков).
  render-distance: 80
  # Размер звезды (множитель)
  star-scale: 2.0
  # Скорость вращения самой картинки звезды, в градусах/секунду.
  # 4 = один оборот за 90 секунд. 0 = без вращения; минус = обратное направление.
  star-rotation-degrees-per-second: 4.0
  # Появление/уход: плавные масштаб и яркость, без изменения PNG (1..200 тиков).
  fade-duration-ticks: 40
  # Старый параметр оставлен для совместимости; в 9.7 используется один тик без инерции.
  follow-interpolation-ticks: 1
  # Скорость движения ВСЕГО неба. 0.15 = полный оборот примерно за 40 минут.
  # Положительное значение — вправо, отрицательное — влево.
  sky-rotation-degrees-per-second: 0.15
  # Максимальное отдаление сферы с сохранением видимого размера (реально ограничивается дальностью клиента).
  sky-depth-multiplier: 3.0
  # Период отправки поворота (2..20, округляется вверх до чётного).
  # 4 = вдвое меньше обновлений, чем в 9.1; клиент дорисовывает промежуточные кадры.
  rotation-update-ticks: 4
  # Масштаб толщины линий (совместим с настройкой старого END_ROD).
  # В 9.1 линии — равномерные плоские полосы без затенения, позади звёзд.
  line-thickness: 0.4
  # Допуск попадания по звезде подзорной трубой (в градусах)
  click-tolerance-degrees: 2.0
  # Период проверки дня/ночи, новых звёзд и превью (1..200 тиков).
  # XYZ и проявление неба обновляются отдельно каждый тик, независимо
  # от этого интервала. Поворот камеры не двигает звёзды.
  update-interval-ticks: 10
  # Старый параметр reanchor-distance больше не используется.

# Публичные профили и частная карточка при Shift + взгляде на игрока.
# В 9.4 настройки медалей и сообщений находятся отдельно: medals/config.yml.
# Файлы выданных медалей: medals/players/<UUID>.yml; /profile medal reload применяет правки.
profiles:
  # Дальность карточки (2..16 блоков); стены/невидимость/vanish учитываются.
  quick-card-distance: 8.0
  # Показывать ли префикс над головой игрока в игре (заменяет ванильный ник
  # картинкой префикса + белый ник). false — над головой ничего не отображается,
  # остаётся обычный ванильный ник. По умолчанию выключено.
  overhead-tags: false
  # Реальные даты медалей, не время игрового мира.
  # system = часовой пояс машины сервера. Можно, например, UTC или Europe/Moscow.
  date-time-zone: system

# Голосовые описания: сообщения в voice/config.yml, Opus записи в voice/records/.
# Нужны Plasmo Voice 2.x на сервере и клиенте. Запись только по команде «запись», 10 секунд.

# Зацеп изморозью и прыжки от стены — механика мода Gouge (https://modrinth.com/mod/gouge).
# ПКМ изморозью по стене в падении: инструмент врезается в грань и трение гасит падение.
# Твёрдый блок (для дропа нужен верный инструмент) гасит его быстрее и в итоге держит
# игрока на месте; мягкий не держит, зато падение после скольжения слабее.
# Двойной присед в окне — прыжок от стены, и только он тратит прочность (4 из 16).
# Подробности и таблицы чисел: docs/UPDATE-25.md. Значения по умолчанию — из gouge.toml.
# Правки применяются после перезагрузки плагина.
gouge:
  # Версия чисел зацепа. Пока здесь стоит 4, значения ниже берутся из файла; если строки нет
  # (старый config.yml), плагин применяет новые числа из кода — иначе владелец не увидит дрифта.
  config-version: 4
  # ==== Зацеп изморозью: механика мода Gouge (modrinth.com/mod/gouge) ====
  # ПКМ по стене в падении — зацеп и скольжение вдоль стены.
  # Присед (Shift) на твёрдом блоке — инструмент держит крепко, игрок сползает тихо
  # (1 блок в секунду); на мягком блоке присед не спасает — сползание идёт своим ходом.
  # Пробел на зажатом приседе — прыжок от стены выше обычного, чтобы карабкаться вверх.
  # Подпрыгнуть у стены с зажатым Shift — зацепиться самому.
  #
  # Дальность зацепа в блоках: сначала луч взгляда, потом запасной горизонтальный луч.
  reach: 2.5
  # Сколько открытого воздуха должно быть под ногами для зацепа по ПКМ: обычный прыжок
  # с пола так не цепляется — для него есть самозахват приседом.
  min-fall-clearance: 1.5
  # Насколько можно снести в сторону от точки захвата, прежде чем инструмент сорвётся.
  max-drift: 1.5
  # Сколько секунд присед удерживает инструмент (игрок всё это время тихо сползает).
  # 0 — без ограничения; 10.0 — время алмазной кирки в моде (Grip его продлевал, чара нет).
  hang-seconds: 0.0
  # Перезарядка изморози после скольжения — настоящий майнкрафтовый кулдаун: инструмент
  # белеет в инвентаре таймером, как заряд ветра, и им нельзя пользоваться, пока он идёт.
  # Кулдаун висит на своей группе (компонент use_cooldown), поэтому обычные алмазные кирки
  # в инвентаре не белеют. На прыжок от стены перезарядка не действует — иначе не получится
  # карабкаться вверх; в креативе её нет, как и расхода прочности.
  slide-cooldown-seconds: 4.0
  # Падение после скольжения по мягкому блоку: доля урона и предел в очках (2 = сердце).
  soft-fall-damage: 0.5
  soft-fall-damage-cap: 6.0
  # Скольжение по стене — плавный дрифт. Скорость входа даёт высота падения (не меньше
  # min-entry-speed, поэтому скольжение начинается даже с двух блоков), а трение устроено
  # наоборот прежнему: в начале скольжения блок держит крепче всего, к «ползущей» скорости
  # хватка слабеет. Поэтому скорость тает дрифтом: по камню полное падение — 53 тика (2.6 с)
  # и 36 блоков, и за тик скорость меняется меньше чем на 4 % — рывка не видно и не чувствуется.
  slide:
    # Предел скорости входа: падение с 20+ блоков быстрее уже не разгоняет скольжение.
    entry-speed: 1.5
    # Минимум скорости входа: даже короткое падение начинает скользить, а не встаёт сразу.
    min-entry-speed: 0.7
    # Твёрдый блок: трение у «ползущей» скорости (hard-friction), надбавка в начале скольжения
    # (hard-friction-ramp, уходит по мере замедления), вклад прочности блока и предел.
    # Считается так: base = hard-friction + hard-friction-hardness * прочность блока
    # (не больше hard-friction-max), трение = base + hard-friction-ramp * (насколько ещё быстро).
    # Камень: 0.041 в начале -> 0.015 у ползущей скорости. Чем выше значения, тем короче
    # скольжение: обсидиан встаёт за 5 тиков и 2.9 блока, железная руда — за 39 тиков и 27.
    hard-friction: 0.006
    hard-friction-ramp: 0.026
    hard-friction-hardness: 0.006
    hard-friction-max: 0.35
    # Минимальная скорость скольжения по твёрдому блоку: 0.12 — 2.4 блока в секунду,
    # скольжение чувствуется, но игрок всё равно встаёт почти на месте.
    hard-floor-speed: 0.12
    # Режим дрифта (зажат шифт): скорость падает ровно на столько за тик, пока не дойдёт
    # до предела закрепа. 0.04 — по твёрдому блоку от полной скорости до предела 37 тиков
    # (1.85 с), по мягкому 30 тиков (1.5 с): торможение ровное, без рывка на последних тиках.
    drift-deceleration: 0.04
    # Предел закрепа по твёрдому блоку: инструмент держит совсем крепко и отпускает игрока
    # на 0.05 — 1 блок в секунду, как прежний шифт. По мягкому блоку предел не трогаем:
    # там остаётся soft-floor-speed (0.30), потому что мягкое изморозь всё равно не держит.
    drift-floor-speed: 0.05
    # Мягкий блок: трение слабее, а ползущая скорость выше — сползание продолжается,
    # приседом его не остановить. Песок тормозит до 0.30 целых 3.5 секунды и 52 блока:
    # по мягкому блоку дрифт самый длинный и самый лёгкий.
    soft-friction: 0.008
    soft-friction-ramp: 0.024
    soft-floor-speed: 0.30
  # Расход прочности за скольжение: по 1 за блок, пока скорость не упала ниже min-speed.
  # 0.8 — это «быстрое» скольжение, а max-per-slide — потолок за одно скольжение: дрифт
  # теперь длинный, и без потолка полное падение стирало бы больше прочности, чем есть
  # у инструмента, — он ломался бы прямо в полёте. Так прочность уходит постепенно,
  # от скольжения к скольжению, а медленное сползание, присед и креатив не тратят ничего.
  slide-durability:
    per-block: 1
    min-speed: 0.8
    max-per-slide: 8
  # Прыжок от стены: только вверх и выше обычного прыжка игрока (0.42), чтобы после прыжка
  # зацепиться заново выше и так подниматься по стене. Толчок в сторону по умолчанию нулевой:
  # с ним игрока сразу относит от грани и карабкаться не получается (в моде было 1.4).
  # Прыгнуть можно, когда дрифт шифтом доехал до предела: тогда дымка пропадает.
  wall-jump:
    forward-boost: 0.0
    upward-boost: 0.55
  # Блоки, которые всегда ведут себя как твёрдые или как мягкие, независимо от ванили.
  # Имена материалов Bukkit: stone, hay_block, copper_block... Списки переопределяют
  # ванильное правило «твёрдый = требует верный инструмент для дропа».
  always-hard: []
  always-soft: []
# Рыбалка: миниигра особого предмета биома.
# Все значения применяются на ходу: после правки — /f8 reload (или перезапуск).
# Изморозь больше не выпадает вместо рыбы «сама собой»: единственный способ
# получить её — выиграть миниигру в зимнем или ледяном биоме.
fishing:
  # Шанс, что при улове вместо рыбы начнётся миниигра особого предмета биома.
  # Для теста поставьте 100 и примените /f8 reload.
  special-item-chance-percent: 5
  special-minigame:
    # Сколько раз надо ударить летающий предмет.
    hits-required: 4
    # Сколько промахов игрок может допустить: каждый взмах во время охоты, не
    # попавший по предмету, — промах (звучит неприятно), а когда промахов
    # наберётся столько, предмет срывается и уходит на дно сам.
    misses-allowed: 4
    # Сколько секунд длится охота (в подсказке тикает это время).
    duration-seconds: 10
    # Купол вокруг игрока: радиус круга и высота полёта предмета.
    radius: 3.2
    height: 1.7
    # Сила рывка предмета в случайную сторону после удара.
    dash-strength: 1.4
    # Чем ближе и точнее надо смотреть на предмет, чтобы удар засчитался.
    hit-range: 4.0
    hit-angle-degrees: 22.0
    # Золотые частицы: как часто и каким радиусом идут круги по воде.
    particle-interval-ticks: 2
    particle-radius: 1.5
    # Полёт предмета. С каждым ударом он злится: носится быстрее, сильнее
    # качается вверх-вниз и делает более резкие рывки в сторону.
    revolution-seconds: 2.2     # секунд на один оборот в начале охоты
    speed-per-hit: 0.35         # +35 % к скорости за каждый удар
    bob-height: 0.5             # базовое раскачивание вверх-вниз, блоки
    bob-per-hit: 0.6            # прибавка к раскачиванию за каждый удар
    dash-per-hit: 0.5           # прибавка к силе рывка за каждый удар
  # Какой предмет считается особым для биома. Ключ — ID биома или шаблон, где
  # «*» заменяет любые символы; значение — ANCIENT_JUG (древний кувшин),
  # ICY_RIME (заледеневшая изморозь) или ID ванильного предмета (например, DIAMOND).
  # Точное совпадение важнее шаблона; шаблоны проверяются по порядку сверху вниз.
  # Если биома в списке нет, миниигра в нём не запускается.
  special-items:
    # Все пустынные биомы: пустыня (в т.ч. пустынные озёра модов) и все
    # пустоши — badlands, eroded_badlands, wooded_badlands.
    "*:*desert*": ANCIENT_JUG
    "*:*badlands*": ANCIENT_JUG
    # Все зимние и ледяные биомы: снежные, мёрзлые, ледяные шипы, роща, пики.
    "*:snowy*": ICY_RIME
    "*:*frozen*": ICY_RIME
    "*:ice_spikes": ICY_RIME
    "*:grove": ICY_RIME
    "*:jagged_peaks": ICY_RIME
