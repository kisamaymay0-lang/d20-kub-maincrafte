settings:
  normal-protection-per-piece: 0.075
  super-protection-per-piece: 0.125
  penalty-per-piece: 0.10
  super-penalty-per-piece: 0.125
  hit-bonus-normal: 0.2      # 0.2 секунды за удар в обычной адаптации
  hit-bonus-super: 0.4       # 0.4 секунды за удар в суперадаптации
  duration-normal: 10
  duration-super: 4
  cooldown-normal: 2
  cooldown-super: 4
  # Интервал действует на набор, продление и повышение адаптации.
  # Миллисекунды пересчитываются в игровые тики с округлением вверх
  # (50 мс = 1 тик при 20 TPS), как и таймер эффекта. Защита не прерывается.
  # Нулевые/отрицательные интервалы заменяются безопасными значениями по умолчанию.
  # Минимальный интервал между засчитываемыми ударами (в миллисекундах)
  damage-interval-normal-ms: 450
  # Для огня/лавы/удушья интервал длиннее, иначе адаптация заполняется слишком быстро
  damage-interval-environment-ms: 2000
  required-hits:
    lvl1: 10
    lvl2: 8
    lvl3: 6
  required-super-hits: 8
  # Настройки чара "Откат I"
rollback:
  # Количество секунд, на которые откатывается игрок
  history-seconds: 5
  
  # Интервал сохранения позиций (в тиках, 20 = 1 секунда)
  # 10 = 0.5 секунды (для точности)
  save-interval-ticks: 10
  
  # Эффекты после телепортации
  effects:
    blindness-duration: 40   # в тиках (40 = 2 секунды)
    slowness-duration: 60    # в тиках (60 = 3 секунды)
    slowness-level: 1
    confusion-duration: 60   # в тиках

# Икра (шифт + ПКМ по треске/лососю)
caviar:
  # Шанс найти икру в рыбе (в процентах). Редкий, но возможный.
  chance-percent: 12
  # Максимальное количество икры за раз
  max-amount: 8

# Созвездия (видны с 13000 до 23000 тиков, только в обычном мире)
constellations:
  # Небесная сфера без инерции: координаты глаз обновляются каждый тик.
  # Весь рисунок медленно вращается по времени, независимо от поворота камеры.
  # Сфера отодвигается при достаточной дальности клиента с сохранением углового размера.
  # Масштаб ограничен обычным туманом чанков; до звёзд нельзя дойти.
  # Визуальное расстояние до звёзд (4..256 блоков).
  render-distance: 80
  # Размер звезды (множитель)
  star-scale: 2.0
  # Скорость вращения самой картинки звезды, в градусах/секунду.
  # 4 = один оборот за 90 секунд. 0 = без вращения; минус = обратное направление.
  star-rotation-degrees-per-second: 4.0
  # Появление/уход: плавные масштаб и яркость, без изменения PNG (1..200 тиков).
  fade-duration-ticks: 40
  # Старый параметр оставлен для совместимости; в 9.7 используется один тик без инерции.
  follow-interpolation-ticks: 1
  # Скорость движения ВСЕГО неба. 0.15 = полный оборот примерно за 40 минут.
  # Положительное значение — вправо, отрицательное — влево.
  sky-rotation-degrees-per-second: 0.15
  # Максимальное отдаление сферы с сохранением видимого размера (реально ограничивается дальностью клиента).
  sky-depth-multiplier: 3.0
  # Период отправки поворота (2..20, округляется вверх до чётного).
  # 4 = вдвое меньше обновлений, чем в 9.1; клиент дорисовывает промежуточные кадры.
  rotation-update-ticks: 4
  # Масштаб толщины линий (совместим с настройкой старого END_ROD).
  # В 9.1 линии — равномерные плоские полосы без затенения, позади звёзд.
  line-thickness: 0.4
  # Допуск попадания по звезде подзорной трубой (в градусах)
  click-tolerance-degrees: 2.0
  # Период проверки дня/ночи, новых звёзд и превью (1..200 тиков).
  # XYZ и проявление неба обновляются отдельно каждый тик, независимо
  # от этого интервала. Поворот камеры не двигает звёзды.
  update-interval-ticks: 10
  # Старый параметр reanchor-distance больше не используется.

# Публичные профили и частная карточка при Shift + взгляде на игрока.
# В 9.4 настройки медалей и сообщений находятся отдельно: medals/config.yml.
# Файлы выданных медалей: medals/players/<UUID>.yml; /profile medal reload применяет правки.
profiles:
  # Дальность карточки (2..16 блоков); стены/невидимость/vanish учитываются.
  quick-card-distance: 8.0
  # Показывать ли префикс над головой игрока в игре (заменяет ванильный ник
  # картинкой префикса + белый ник). false — над головой ничего не отображается,
  # остаётся обычный ванильный ник. По умолчанию выключено.
  overhead-tags: false
  # Реальные даты медалей, не время игрового мира.
  # system = часовой пояс машины сервера. Можно, например, UTC или Europe/Moscow.
  date-time-zone: system

# Голосовые описания: сообщения в voice/config.yml, Opus записи в voice/records/.
# Нужны Plasmo Voice 2.x на сервере и клиенте. Запись только по команде «запись», 10 секунд.

# Зацеп изморозью и прыжки от стены — механика мода Gouge (https://modrinth.com/mod/gouge).
# ПКМ изморозью по стене в падении: инструмент врезается в грань и трение гасит падение.
# Твёрдый блок (для дропа нужен верный инструмент) гасит его быстрее и в итоге держит
# игрока на месте; мягкий не держит, зато падение после скольжения слабее.
# Двойной присед в окне — прыжок от стены, и только он тратит прочность (4 из 16).
# Подробности и таблицы чисел: docs/UPDATE-25.md. Значения по умолчанию — из gouge.toml.
# Правки применяются после перезагрузки плагина.
gouge:
  # Дальность зацепа в блоках: сначала луч взгляда, потом запасной горизонтальный луч.
  reach: 2.5
  # Сколько открытого воздуха должно быть под ногами: обычный прыжок зацепа не даёт.
  min-fall-clearance: 1.5
  # Насколько можно снести в сторону от точки захвата, прежде чем инструмент сорвётся.
  max-drift: 1.5
  # Сколько секунд изморозь держит игрока на месте, пока он висит, а не скользит.
  # 10.0 — время алмазной кирки в моде (Grip его продлевал, чар в плагине нет).
  hang-seconds: 10.0
  # Пауза после срыва и после прыжка, когда зацепиться снова нельзя. В моде это
  # mechanics.slip_cooldown = 5 секунд, но там его срезает чар Momentum (до 2 с на III),
  # а чара у нас нет — иначе прыжок от стены нельзя было бы связать со следующим зацепом.
  # Поставьте 5.0, если хотите ровно модовое поведение без чар.
  slip-cooldown-seconds: 0.0
  # Падение после скольжения по мягкому блоку: доля урона и предел в очках (2 = сердце).
  soft-fall-damage: 0.5
  soft-fall-damage-cap: 6.0
  wall-jump:
    # Окно двойного приседа: отпустить присед и нажать снова быстрее этого времени.
    window-seconds: 0.7
    # Куда отправляет прыжок: от грани блока и вверх (mod wall_jump.forward_boost/upward_boost).
    forward-boost: 1.4
    upward-boost: 1.1
  # Блоки, которые всегда ведут себя как твёрдые или как мягкие, независимо от ванили.
  # Имена материалов Bukkit: stone, hay_block, copper_block... Списки переопределяют
  # ванильное правило «твёрдый = требует верный инструмент для дропа».
  always-hard: []
  always-soft: []
