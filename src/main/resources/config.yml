# f8-plugin. После правок: /f8 reload (часть настроек требует перезапуска).

settings:
  normal-protection-per-piece: 0.075
  super-protection-per-piece: 0.125
  penalty-per-piece: 0.10
  super-penalty-per-piece: 0.125
  hit-bonus-normal: 0.2          # секунды за удар
  hit-bonus-super: 0.4
  duration-normal: 10
  duration-super: 4
  cooldown-normal: 2
  cooldown-super: 4
  damage-interval-normal-ms: 450        # минимум между засчитанными ударами, мс (50 мс = 1 тик)
  damage-interval-environment-ms: 2000  # огонь/лава/удушье — реже, иначе адаптация заполняется мгновенно
  required-hits:
    lvl1: 10
    lvl2: 8
    lvl3: 6
  required-super-hits: 8

# Чар «Откат I».
rollback:
  history-seconds: 5             # на сколько секунд назад откатывает
  save-interval-ticks: 10        # период записи позиций (20 тиков = 1 с)
  effects:
    blindness-duration: 40       # в тиках
    slowness-duration: 60
    slowness-level: 1
    confusion-duration: 60

# Зависимость от сигарет (в тиках). Для теста: first-stage 200, interval 80.
cigarette:
  addiction:
    first-stage-ticks: 24000
    interval-ticks: 4800

# Икра: шифт + ПКМ по треске/лососю.
caviar:
  chance-percent: 12
  max-amount: 8

# Дуэли диких котов: chance-per-tick — шанс старта за тик (0.001 = 0.1 %, 0 — выключено).
# На половине здоровья 90 % дуэлей кончаются миром (CatBattleManager.SPARE_CHANCE).
cat-battles:
  enabled: true
  chance-per-tick: 0.001

# Питомцы. Модели — из вашего пака f8resurs, плагин пак не меняет.
pets:
  test-models:                   # первый питомец, смена раз в секунду
    - "f8resurs:test-pets"
    - "f8resurs:test-pets2"
  crown-model: "f8resurs:pet-2"
  crown-gap: 0.35                # зазор короны над макушкой, блоки
  # Надписи над головами: размер (1.0 — обычный) и высота над макушкой в блоках.
  speech:
    player-scale: 1.0
    player-height: 0.35
    player-height-with-crown: 0.85
    pet-1-scale: 0.5
    pet-1-height: 0.55
    pet-2-scale: 0.5
    pet-2-height: 0.6

# Медный нотный блок: ступени окисления 1s..4s.
copper-note-block:
  # Сколько минут в среднем проходит до следующей ступени.
  # В ванили медь стареет примерно за 50-80 минут. 0 — окисление выключено.
  oxidation-minutes: 60

# Созвездия: видны с 13000 до 23000 тиков, только в обычном мире.
constellations:
  render-distance: 80                      # визуальное расстояние до звёзд, блоки (4..256)
  star-scale: 2.0
  star-rotation-degrees-per-second: 4.0    # 4 = оборот за 90 с; 0 — без вращения
  fade-duration-ticks: 40                  # появление и уход (1..200)
  follow-interpolation-ticks: 1            # устарело, оставлено для совместимости
  sky-rotation-degrees-per-second: 0.15    # 0.15 ≈ оборот за 40 мин; минус — влево
  sky-depth-multiplier: 3.0
  rotation-update-ticks: 4                 # период отправки поворота (2..20, чётное)
  line-thickness: 0.4
  depth-fill: 0.95                         # 1.0 — поверх блоков, 0.5 — чаще прячется за стенами
  click-tolerance-degrees: 2.0             # допуск попадания подзорной трубой
  update-interval-ticks: 10                # проверка дня/ночи и новых звёзд (1..200)

# Профили и карточка по Shift + взгляду. Медали настраиваются в medals/config.yml.
profiles:
  quick-card-distance: 8.0       # 2..16 блоков
  overhead-tags: false           # префикс над головой вместо ванильного ника
  date-time-zone: system         # или UTC, Europe/Moscow

# Зацеп изморозью и прыжок от стены (механика мода Gouge).
# ПКМ изморозью по стене в падении — зацеп и скольжение; ПКМ зажата — держит, отпустил — срывается.
# Присед на твёрдом блоке держит крепко (сползание 1 блок/с), на мягком не спасает.
# Пробел с зажатым Shift у стены — прыжок вверх (тратит 4 прочности из 16).
# Подробности и таблицы чисел: docs/UPDATE-25.md. Правки — после перезагрузки плагина.
gouge:
  config-version: 4              # без этой строки применяются новые числа из кода
  reach: 2.5                     # дальность зацепа, блоки
  min-fall-clearance: 1.5        # сколько воздуха под ногами нужно для зацепа по ПКМ
  max-drift: 1.5                 # снос в сторону до срыва, блоки
  hang-seconds: 0.0              # сколько присед держит инструмент; 0 — без ограничения
  hold-grace-ticks: 8            # ожидание отклика зажатой ПКМ, тики (0 — держать по взгляду)
  slide-cooldown-seconds: 4.0    # кулдаун изморози после скольжения
  soft-fall-damage: 0.5          # доля урона падения после скольжения по мягкому блоку
  soft-fall-damage-cap: 6.0      # предел этого урона, очки (2 = сердце)
  # Скольжение: скорость входа берётся из высоты падения, трение сильнее всего в начале.
  slide:
    entry-speed: 1.5             # предел скорости входа
    min-entry-speed: 0.7         # минимум, чтобы скольжение вообще началось
    hard-friction: 0.006         # твёрдый блок: трение у ползущей скорости
    hard-friction-ramp: 0.026    # надбавка к трению в начале скольжения
    hard-friction-hardness: 0.006  # вклад прочности блока
    hard-friction-max: 0.35      # предел этой надбавки
    hard-floor-speed: 0.12       # минимальная скорость по твёрдому блоку
    drift-deceleration: 0.04     # сброс скорости за тик в дрифте (шифт)
    drift-floor-speed: 0.05      # предел закрепа по твёрдому блоку
    soft-friction: 0.008         # мягкий блок: трение слабее…
    soft-friction-ramp: 0.024
    soft-floor-speed: 0.30       # …и ползущая скорость выше
  # Расход прочности: 1 за блок, пока скорость не ниже min-speed; max-per-slide — потолок.
  slide-durability:
    per-block: 1
    min-speed: 0.8
    max-per-slide: 8
  # Прыжок от стены: только вверх, выше обычного прыжка (0.42).
  wall-jump:
    forward-boost: 0.0
    upward-boost: 0.55
  # Материалы Bukkit, всегда твёрдые/мягкие (переопределяют ванильное правило).
  always-hard: []
  always-soft: []

# Рыбалка: миниигра особого предмета биома. Применяется по /f8 reload.
fishing:
  special-item-chance-percent: 5   # 100 — для теста
  special-minigame:
    hits-required: 4               # сколько раз ударить предмет
    misses-allowed: 4              # столько промахов — предмет срывается
    duration-seconds: 10
    radius: 3.2                    # купол вокруг игрока
    height: 1.7                    # высота полёта предмета
    dash-strength: 1.4
    hit-range: 4.0                 # близость предмета к лучу взгляда
    hit-radius: 0.8
    hit-angle-degrees: 22.0        # ширина трубки попадания
    ping-compensation: true        # судить удар по картинке игрока
    particle-interval-ticks: 2
    particle-radius: 1.5
    revolution-seconds: 2.2        # оборот в начале охоты
    speed-per-hit: 0.35            # +35 % к скорости за удар
    bob-height: 0.5
    bob-per-hit: 0.6
    dash-per-hit: 0.5
  # Особый предмет по биому: ключ — ID или шаблон с «*», значение — ANCIENT_JUG,
  # ICY_RIME, CRAB_CLAW либо ID ванильного предмета. Точное совпадение важнее шаблона.
  special-items:
    "*:*desert*": ANCIENT_JUG
    "*:*badlands*": ANCIENT_JUG
    "*:swamp": CRAB_CLAW
    "*:*swamp*": CRAB_CLAW
    "*:snowy*": ICY_RIME
    "*:*frozen*": ICY_RIME
    "*:ice_spikes": ICY_RIME
    "*:grove": ICY_RIME
    "*:jagged_peaks": ICY_RIME
  # Клешня краба: +3 блока к дальности; в правой руке копает инструментами из инвентаря
  # с двойным расходом прочности.
  crab-claw:
    reach-blocks: 3.0
    wear-per-block: 2

# Бамбуковая бочка и пиратский ром: тиков на 1 год выдержки (24000 = 1 игровой день).
bamboo_barrel:
  ticks_per_year: 24000
