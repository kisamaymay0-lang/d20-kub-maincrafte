  hit-bonus-super: 0.4

  # ===== ДЛИТЕЛЬНОСТЬ (в секундах) =====
  duration-normal: 10
  duration-super: 4

  # ===== КУЛДАУН (в секундах) =====
  cooldown-normal: 4
  cooldown-super: 8

  # ===== ТРЕБОВАНИЯ ДЛЯ АКТИВАЦИИ =====
  required-hits:
    lvl1: 10
    lvl2: 8
    lvl3: 6

  required-super-hits: 8
