# Набор косметики (кейс) — файл в plugins/f8-plugin/content/cosmeticpacks/.
#
# Что это: сундучок в меню косметики (/profile → «Настроить косметику» →
# «Наборы косметики»). Кейс набора достаёт ОДНУ косметику из этого файла —
# ту, которой у игрока ещё нет. Всё, что уже есть, из кейса не выпадает.
#
# Как выдавать кейсы набора:
#   /profile case cpack give <ник> <набор> [число]   — выдать (по умолчанию 1)
#   /profile case cpack take <ник> <набор> [число]   — забрать
#   /profile case cpack list <ник>                   — сколько кейсов у игрока
# «набор» — это имя файла без .yml (здесь: kosmetika-nabor1) или строка name.
#
# ── ПОЛЯ ФАЙЛА ───────────────────────────────────────────────────────────────
# name:       название на сундучке;
# time-hours: срок кейса в часах С МОМЕНТА ВЫДАЧИ. -1 — бессрочный кейс.
#             Сгоревший кейс открыть нельзя, а выпавшая косметика остаётся навсегда;
# cosmetics:  список моделей из settings/cosmetics.yml (поле file). Имя и цвет
#             берутся оттуда же — здесь их дублировать не нужно.
#             Можно переопределить на месте: name и/или color рядом с file.
#
# Внутри набора удобно держать 3–9 моделей: в кейсе девять карточек, и все они
# должны быть видны сразу.
name: 'Набор косметики №1'
time-hours: -1
cosmetics:
  - kosmetika1
  - kosmetika2
  - kosmetika3
