# Дополнительный файл косметики — НЕОБЯЗАТЕЛЬНЫЙ.
#
# Зачем он нужен: settings/cosmetics.yml — основной список косметики, который
# приезжает из комплекта и обновляется вместе с плагином. Всё своё (сезонное,
# подарочное, отдельный набор для ивента) удобнее держать отдельными файлами в
# этой папке: они не смешиваются с основным и их можно просто убрать, ничего не
# правя в settings/.
#
# Папка: plugins/f8-plugin/content/cosmetics/
# Файл:  любой *.yml или *.yaml в ней (этот пример тоже читается — в нём пока
#        ничего не описано, только подсказки).
# Когда применяется: /profile cosmetic reload, /f8 reload или перезапуск сервера.
#        Новый файл подхватывается сразу, без рестарта.
#
# Формат ровно как в settings/cosmetics.yml:
#   cosmetics:            — обязательный раздел, без него файл не читается;
#   <id>:                 — техническое имя записи, латиницей и без пробелов
#                           (сохраняется в профилях игроков, потом не меняйте);
#     name:  'Название'   — как косметика называется в меню и в кейсе;
#     color: '#8FE3F5'    — цвет названия и салюта при вскрытии кейса;
#     file:  kosmetika4   — модель из ресурспака: assets/f8resurs/items/<file>.json
#                           (комплект — kosmetika1 … kosmetika3).
#
# Номер косметики берётся из имени модели: kosmetika4 — №4, kosmetika12 — №12.
# По номеру её выдают и забирают: /profile cosmetic give <ник> 4
#
# Пример — раскомментируйте и подставьте свою модель:
#
# cosmetics:
#   korona_snega:
#     name: 'Корона снега'
#     color: '#BFE9FF'
#     file: kosmetika4
#   korona_avrory:
#     name: 'Корона авроры'
#     color: '#7FF0D2'
#     file: kosmetika5

# Пустой раздел ниже нужен только для того, чтобы файл оставался рабочим,
# пока пример закомментирован. Когда раскомментируете свой блок — удалите его.
cosmetics: {}
