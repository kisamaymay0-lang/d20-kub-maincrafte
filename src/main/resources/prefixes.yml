# /profile → «Настроить префикс» → список и кейсы префиксов.
# Каждый префикс: id (как в данных игрока), name — как он выглядит перед ником,
# color — цвет текста префикса, file — файл иконки в ресурспаке (items/<file>.json,
# модели/текстуры называются pref1, pref2, … и их можно заменить своими).
# Кейсы выдаёт администратор: /profile case prefix give <ник>
