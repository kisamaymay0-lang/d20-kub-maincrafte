name: f8-plugin
version: 8
main: com.yourserver.adaptation.AdaptationPlugin
api-version: 1.20
description: "F8/Adaptation: чары Адаптация и Бросок I, флаконы, тотем Отката, медный нотный блок и меню F8"
website: https://github.com/kisamaymay0-lang/d20-kub-maincrafte

commands:
  d20:
    description: Выдать книгу с чаром Бросок I
    permission: f8.admin
    usage: /d20 give <игрок>, /d20 cheat <1-20> или /d20 enchant <ID>

  f8:
    description: Меню дополнительных возможностей F8
    permission: f8.admin
    usage: /f8

permissions:
  f8.admin:
    description: Доступ к меню F8
    default: op
