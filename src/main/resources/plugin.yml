name: f8-daptation-sosicka-bobr551
version: 8
main: com.yourserver.adaptation.AdaptationPlugin
api-version: 1.20

commands:
  d20:
    description: Выдать книгу с чаром Бросок I
    permission: f8.admin
    usage: /d20 give <игрок>, /d20 cheat <1-20> или /d20 enchant <ID>
  f8:
    description: Открывает меню администратора
    permission: f8.admin
    usage: /<command>
    aliases:  # <-- ДОБАВЬТЕ ЭТОТ БЛОК
      - adminmenu
      - am
      - меню
      - админменю
    
permissions:
  f8.admin:
    description: Доступ к меню F8
    default: op
