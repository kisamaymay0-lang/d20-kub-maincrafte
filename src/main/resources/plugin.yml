name: f8-daptation-sosicka-bobr551
version: 8
main: com.yourserver.adaptation.AdaptationPlugin
api-version: 1.20

commands:
  d20:
    description: Выдать книгу с чаром Бросок I
    permission: diceroll.admin
    usage: /d20 give <игрок>, /d20 cheat <1-20> или /d20 enchant <ID>
  adaptation:
    description: управление плагином f9-daptation-sosika-bobr551
    permission: adaptation.admin
    usage: /adaptation <give/reload>
  rollback:
    description: Выдать тотем с чаром "Откат I"
    usage: /rollback give <игрок>
    permission: rollback.admin

permissions:
  rollback.admin:
    description: Право на использование команды /rollback
    default: op
