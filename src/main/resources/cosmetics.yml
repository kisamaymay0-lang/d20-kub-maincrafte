# Косметика профилей. Рабочий файл лежит в папке плагина:
#   plugins/f8-plugin/cosmetics.yml
# (при первом запуске он копируется из jar; изменения применяются командой
#   /profile cosmetic reload  — перезапуск не нужен).
#
# Косметика — это предмет, который ВИЗУАЛЬНО надет на голову игрока.
# Он не занимает слот шлема, не мешает надеть настоящий шлем и не появляется
# в инвентаре: это отдельная сущность-отображение у головы. Её видит и сам
# владелец, и остальные игроки.
#
# Модель берётся из ресурспака f8resurs: значению file отвечает файл
#   assets/f8resurs/items/<file>.json
# (комплект kosmetika1 … kosmetika3; свои модели кладите рядом и меняйте file).
#
#   id    — техническое имя записи (сохраняется в данных игрока);
#   name  — название косметики (в меню и в кейсе);
#   color — цвет названия и салюта при вскрытии кейса;
#   file  — модель предмета из ресурспака (kosmetika1 → f8resurs:kosmetika1).
#
# НОМЕР косметики = порядок записей здесь: первая запись — №1, вторая — №2 и т.д.
# По номеру косметику выдают и забирают администраторы (all — сразу вся):
#   /profile cosmetic give|take <ник> <номер|all>
#   /profile cosmetic list <ник>
# Кейсы косметики выдаёт: /profile case cosmetic give <ник>
#
# Как и префикс, косметика надевается в меню: /profile → «Настроить косметику».
cosmetics:
  kosmetika1:
    name: 'Косметика №1'
    color: '#E6B94B'
    file: kosmetika1
  kosmetika2:
    name: 'Косметика №2'
    color: '#8FE3F5'
    file: kosmetika2
  kosmetika3:
    name: 'Косметика №3'
    color: '#C79BF0'
    file: kosmetika3
