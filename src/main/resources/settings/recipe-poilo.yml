# Напитки: что можно приготовить, из чего и как они выглядят.
# Файл лежит в папке плагина: plugins/f8-plugin/settings/recipe-poilo.yml
# Применяется командой /f8 reload — перезапуск не нужен.
#
# ── ЧТО ЭТО ─────────────────────────────────────────────────────────────────
# Здесь описан КАЖДЫЙ напиток: и тот, что смешивается в шейкере, и тот, что
# настаивается в бамбуковой бочке. Добавить новый напиток — это дописать блок
# ниже и сделать /f8 reload. Код править не нужно.
#
# ── ЗАПИСЬ НАПИТКА ──────────────────────────────────────────────────────────
# <id>:                 техническое имя, латиницей без пробелов. Оно пишется в
#                       данные бутылочки, поэтому потом его лучше не менять
#                       (иначе старые бутылочки станут «мутью»).
#   name:               название напитка — в подсказке оно золотое;
#   color:  '#RRGGBB'   цвет жидкости в бутылочке;
#   model:  <модель>    модель из ресурспака: f8resurs:<model>. Пусто — без модели;
#   description:        строка описания в подсказке. Пусто — описания нет;
#   hint:               необязательная жёлтая приписка «может стоит добавить …»:
#                         before: 'может стоит добавить в нее '
#                         drink:  'пиво'        (это слово будет подчёркнуто)
#                         after:  '?...'
#                       Есть hint — у описания маркер ▶, нет — точка •;
#   method:             shaker  — смешивается в шейкере;
#                       barrel  — настаивается в бамбуковой бочке (в шейкер
#                                 такой напиток не кладётся);
#   ingredients:        что должно лежать.
#                       Для method: shaker — список, как в примерах ниже.
#                       Для method: barrel — «предмет: сколько», потому что бочке
#                       важно количество. Названия ингредиентов бочки:
#                         coal              — уголь (древесный тоже подойдёт)
#                         sugar_cane        — сахарный тростник
#                         water_bottle      — бутылочка воды
#                         hot_water_bottle  — бутылочка горячей воды
#                         sugar             — сахар
#                         bone_meal         — костная мука
#                         low_sweetie_berry — помятые сладкие ягоды
#                         hard_sweetie_berry — продавленные сладкие ягоды
#                       Плюс обычные предметы, если своих не хватает:
#                         wheat, potato, apple, sweet_berries, glow_berries,
#                         honey_bottle, melon_slice, cocoa_beans
#                       Другого бочка не принимает: новый СВОЙ предмет — это код,
#                       а не настройка; бочка скажет об этом над хотбаром.
#                       Вода понимается нестрого: там, где просят water_bottle,
#                       подойдёт и горячая вода. Наоборот — нет (ром требует
#                       именно горячую).
#                       Совпадение точное: лишний предмет останавливает варку.
#                       Сколько лет до какого качества и что написано в подсказке
#                       — это уже не здесь, а в data/napitki/napitki.yml.
#                       Названия ингредиентов шейкера:
#                         honeycomb         — медовые соты
#                         honey_bottle      — бутылочка мёда
#                         water_bottle      — бутылочка воды
#                         hot_water_bottle  — бутылочка горячей воды
#                         sugar             — сахар
#                         sweet_berries     — сладкие ягоды
#                         ice               — любой лёд
#                         cocoa_beans       — какао-бобы
#                         milk_bucket       — ведро молока
#                         green_dye         — зелёный краситель
#   additives:          ПОЛОЖИТЕЛЬНЫЕ добавки. Список отрицательных писать не
#                       надо: всё, чего здесь нет, считается плохим.
#                       1 плохая добавка  — тошнота;
#                       2 плохих          — тошнота II и отравление;
#                       3 и больше        — тошнота II и отравление II.
#
# ── ПОРЯДОК ВАЖЕН ───────────────────────────────────────────────────────────
# Рецепты проверяются сверху вниз, побеждает первый подошедший. Если набор
# подходит под два напитка сразу, выиграет тот, что выше в этом файле.
# Ничего не подошло — получится «муть» (murk): болотная жижа с тошнотой.
#
# ВАЖНО: «муть» — запасной напиток, у него нет ингредиентов. Не убирайте её
# из файла: именно она выдаётся, когда рецепт не совпал.
#
# ── СЕЙЧАС В ФАЙЛЕ ──────────────────────────────────────────────────────────
#   mead        Медовуха       соты + горячая вода        (+, сахар)
#   matcha_tea  Матча-чай      зелёный краситель + горячая вода
#   daiquiri    Дайкири        ягоды + сахар + вода
#   iced_latte  Айс-Латте      какао + лёд + молоко
#   murk        Муть           запасной вариант
#   pirate_rum  Пиратский ром  бочка: тростник + уголь + 3 горячей воды
#   wine        Вино           бочка: 3 помятых ягоды + вода
#   sweet_wine  Сладкое вино   бочка: 3 помятых ягоды + сахар + вода
#   white_wine  Белое вино     бочка: 3 помятых ягоды + костная мука + вода
#   bitter_wine Горькое вино   бочка: 3 продавленных ягоды + вода
#   beer        Пиво           бочка: 3 сахарных тростника + 2 воды
#
# Как добавить свой напиток целиком (рецепт + сроки + опьянение) — с полным
# примером в docs/NAPITKI.md; там же три ловушки, на которые легко налететь.
recipes:
  mead:
    name: 'Медовуха?'
    color: '#EBAF28'
    model: medovuha
    description: 'Безалькогольная медовуха, '
    hint:
      before: 'может стоит добавить в нее '
      drink: 'пиво'
      after: '?...'
    method: shaker
    ingredients: [honeycomb, hot_water_bottle]
    additives: [sugar]

  matcha_tea:
    name: 'Матча-чай'
    color: '#78A83C'
    model: matcha-chai
    description: 'Чай с бархатистым вкусом, дающий легкую бодрость и яркость ума.'
    method: shaker
    ingredients: [green_dye, hot_water_bottle]
    additives: [honey_bottle, milk_bucket, ice]

  daiquiri:
    name: 'Дайкири?'
    color: '#F0466E'
    model: daikiri
    description: 'Безалкогольный дайкири, '
    hint:
      before: 'может стоит в него добавить '
      drink: 'белое вино'
      after: '?...'
    method: shaker
    ingredients: [sweet_berries, sugar, water_bottle]
    additives: [ice, sweet_berries]

  iced_latte:
    name: 'Айс-Латте'
    color: '#E8C499'
    model: iced_latte
    description: 'Прохладный кофейный напиток с кубиками льда... освежает!'
    method: shaker
    ingredients: [cocoa_beans, ice, milk_bucket]
    additives: [honey_bottle, ice]

  # Запасной напиток: выдаётся, когда набор ингредиентов ни подо что не подошёл.
  murk:
    name: 'Муть'
    color: '#4E9331'
    model: ''
    description: 'Какая-то болотная жижа, может стоит попробовать другие ингридиенты?)'
    method: shaker
    ingredients: []
    additives: []

  # Ром не смешивают в шейкере: он зреет в бамбуковой бочке, а годы выдержки
  # бочка считает сама (data/napitki/napitki.yml).
  pirate_rum:
    name: 'Пиратский ром'
    color: '#8B3A14'
    model: skull_poilo
    description: ''
    method: barrel
    ingredients:
      sugar_cane: 1
      coal: 1
      hot_water_bottle: 3
    additives: []

  # ── ВИНА ──────────────────────────────────────────────────────────────────
  # Пока без моделей: модель в ресурспаке появится позже, а до тех пор бутылочка
  # просто нужного цвета. Описания — заглушка (прочерк), они лежат в
  # data/napitki/napitki.yml, в поле quality-description.
  wine:
    name: 'Вино'
    color: '#7A1123'
    model: ''
    description: ''
    method: barrel
    ingredients:
      low_sweetie_berry: 3
      water_bottle: 1
    additives: []

  sweet_wine:
    name: 'Сладкое вино'
    color: '#B23A63'
    model: ''
    description: ''
    method: barrel
    ingredients:
      low_sweetie_berry: 3
      sugar: 1
      water_bottle: 1
    additives: []

  white_wine:
    name: 'Белое вино'
    color: '#E4D9A0'
    model: ''
    description: ''
    method: barrel
    ingredients:
      low_sweetie_berry: 3
      bone_meal: 1
      water_bottle: 1
    additives: []

  bitter_wine:
    name: 'Горькое вино'
    color: '#3E0C18'
    model: ''
    description: ''
    method: barrel
    ingredients:
      hard_sweetie_berry: 3
      water_bottle: 1
    additives: []

  # Пиво: «солод» у нас — сахарный тростник, плюс вода. Пьянит слабо
  # (единицы за глоток — в data/napitki/napitki.yml, раздел beer).
  beer:
    name: 'Пиво'
    color: '#C68B2E'
    model: ''
    description: ''
    method: barrel
    ingredients:
      sugar_cane: 3
      water_bottle: 2
    additives: []

  # ── ПРИМЕР НОВОГО НАПИТКА ─────────────────────────────────────────────────
  # Раскомментируйте и подставьте свои значения — появится новый напиток.
  #
  # kompot:
  #   name: 'Компот'
  #   color: '#C2412F'
  #   model: ''                          # своей модели нет — только цвет
  #   description: 'Ягодный компот, как в детстве.'
  #   method: shaker
  #   ingredients: [sweet_berries, water_bottle, sugar]
  #   additives: [ice, honey_bottle]     # всё остальное — плохие добавки
