# Напитки: что можно приготовить, из чего и как они выглядят.
# Файл лежит в папке плагина: plugins/f8-plugin/settings/recipe-poilo.yml
# Применяется командой /f8 reload — перезапуск не нужен.
#
# ── ЧТО ЭТО ─────────────────────────────────────────────────────────────────
# Здесь описан КАЖДЫЙ напиток: и тот, что смешивается в шейкере, и тот, что
# настаивается в бамбуковой бочке. Добавить новый напиток — это дописать блок
# ниже и сделать /f8 reload. Код править не нужно.
#
# ── ЗАПИСЬ НАПИТКА ──────────────────────────────────────────────────────────
# <id>:                 техническое имя, латиницей без пробелов. Оно пишется в
#                       данные бутылочки, поэтому потом его лучше не менять
#                       (иначе старые бутылочки станут «мутью»).
#   name:               название напитка — в подсказке оно золотое;
#   color:  '#RRGGBB'   цвет жидкости в бутылочке;
#   model:  <модель>    модель из ресурспака: f8resurs:<model>. Пусто — без модели;
#   description:        строка описания в подсказке. Пусто — описания нет;
#   hint:               необязательная жёлтая приписка «может стоит добавить …»:
#                         before: 'может стоит добавить в нее '
#                         drink:  'пиво'        (это слово будет подчёркнуто)
#                         after:  '?...'
#                       Есть hint — у описания маркер ▶, нет — точка •;
#   method:             shaker  — смешивается в шейкере;
#                       barrel  — настаивается в бамбуковой бочке (в шейкер
#                                 такой напиток не кладётся);
#   ingredients:        что должно лежать в шейкере (только для method: shaker).
#                       Названия ингредиентов:
#                         honeycomb         — медовые соты
#                         honey_bottle      — бутылочка мёда
#                         water_bottle      — бутылочка воды
#                         hot_water_bottle  — бутылочка горячей воды
#                         sugar             — сахар
#                         sweet_berries     — сладкие ягоды
#                         ice               — любой лёд
#                         cocoa_beans       — какао-бобы
#                         milk_bucket       — ведро молока
#                         green_dye         — зелёный краситель
#   additives:          ПОЛОЖИТЕЛЬНЫЕ добавки. Список отрицательных писать не
#                       надо: всё, чего здесь нет, считается плохим.
#                       1 плохая добавка  — тошнота;
#                       2 плохих          — тошнота II и отравление;
#                       3 и больше        — тошнота II и отравление II.
#
# ── ПОРЯДОК ВАЖЕН ───────────────────────────────────────────────────────────
# Рецепты проверяются сверху вниз, побеждает первый подошедший. Если набор
# подходит под два напитка сразу, выиграет тот, что выше в этом файле.
# Ничего не подошло — получится «муть» (murk): болотная жижа с тошнотой.
#
# ВАЖНО: «муть» — запасной напиток, у него нет ингредиентов. Не убирайте её
# из файла: именно она выдаётся, когда рецепт не совпал.
#
# ── СЕЙЧАС В ФАЙЛЕ ──────────────────────────────────────────────────────────
#   mead        Медовуха       соты + горячая вода        (+, сахар)
#   matcha_tea  Матча-чай      зелёный краситель + горячая вода
#   daiquiri    Дайкири        ягоды + сахар + вода
#   iced_latte  Айс-Латте      какао + лёд + молоко
#   murk        Муть           запасной вариант
#   pirate_rum  Пиратский ром  только бочка, в шейкере не смешивается
recipes:
  mead:
    name: 'Медовуха?'
    color: '#EBAF28'
    model: medovuha
    description: 'Безалькогольная медовуха, '
    hint:
      before: 'может стоит добавить в нее '
      drink: 'пиво'
      after: '?...'
    method: shaker
    ingredients: [honeycomb, hot_water_bottle]
    additives: [sugar]

  matcha_tea:
    name: 'Матча-чай'
    color: '#78A83C'
    model: matcha-chai
    description: 'Чай с бархатистым вкусом, дающий легкую бодрость и яркость ума.'
    method: shaker
    ingredients: [green_dye, hot_water_bottle]
    additives: [honey_bottle, milk_bucket, ice]

  daiquiri:
    name: 'Дайкири?'
    color: '#F0466E'
    model: daikiri
    description: 'Безалкогольный дайкири, '
    hint:
      before: 'может стоит в него добавить '
      drink: 'белое вино'
      after: '?...'
    method: shaker
    ingredients: [sweet_berries, sugar, water_bottle]
    additives: [ice, sweet_berries]

  iced_latte:
    name: 'Айс-Латте'
    color: '#E8C499'
    model: iced_latte
    description: 'Прохладный кофейный напиток с кубиками льда... освежает!'
    method: shaker
    ingredients: [cocoa_beans, ice, milk_bucket]
    additives: [honey_bottle, ice]

  # Запасной напиток: выдаётся, когда набор ингредиентов ни подо что не подошёл.
  murk:
    name: 'Муть'
    color: '#4E9331'
    model: ''
    description: 'Какая-то болотная жижа, может стоит попробовать другие ингридиенты?)'
    method: shaker
    ingredients: []
    additives: []

  # Ром не смешивают в шейкере: он зреет в бамбуковой бочке, а годы выдержки
  # бочка считает сама (bamboo_barrel.ticks_per_year в bamboo_barrel.yml).
  pirate_rum:
    name: 'Пиратский ром'
    color: '#8B3A14'
    model: skull_poilo
    description: ''
    method: barrel
    ingredients: []
    additives: []

  # ── ПРИМЕР НОВОГО НАПИТКА ─────────────────────────────────────────────────
  # Раскомментируйте и подставьте свои значения — появится новый напиток.
  #
  # kompot:
  #   name: 'Компот'
  #   color: '#C2412F'
  #   model: ''                          # своей модели нет — только цвет
  #   description: 'Ягодный компот, как в детстве.'
  #   method: shaker
  #   ingredients: [sweet_berries, water_bottle, sugar]
  #   additives: [ice, honey_bottle]     # всё остальное — плохие добавки
