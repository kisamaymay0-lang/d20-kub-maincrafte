# Напитки: шейкер, посуда RP Engine и бамбуковая бочка для рома.
# Пиратский ром — алкоголь: он доходит только в бочке и не бывает ингредиентом шейкера.

# Посуда RP Engine: ПКМ шейкером по поставленной посуде наливает напиток,
# а с посудой в руке напиток забирают из шейкера вместо бутылочки.
# id пишется как «папка:предмет» — ровно как в plugins/RPEngine/content/<папка>/items.
# Готовые файлы посуды: docs/rpengine/glassware.yml.
shaker:
  glass-models:
    - testpack:stakan
    - testpack:bokal
    - testpack:ryumka

# Бамбуковая бочка и пиратский ром: тиков на 1 год выдержки (24000 = 1 игровой день).
bamboo_barrel:
  ticks_per_year: 24000
