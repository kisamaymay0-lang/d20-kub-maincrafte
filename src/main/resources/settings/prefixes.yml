# Префиксы профилей: список, из которого выбирают /profile prefix.
# Файл лежит в папке плагина: plugins/f8-plugin/settings/prefixes.yml
# (при первом запуске он копируется из jar; изменения применяются командой
#   /profile prefix reload или /f8 reload — перезапуск не нужен).
#
# Префикс — это КАРТИНКА (иконка) перед ником. Ник всегда белый и не меняется.
# Иконка видна в чате, в списке игроков (tab), над головой, в профиле и в кейсах.
# На клиенте должен быть установлен ресурспак f8resurs (файл f8resurs-resourcepack.zip):
# без него иконка перед ником отображается как «сломанные» символы.
#   id    — техническое имя записи (сохраняется в данных игрока);
#   name  — название префикса (в меню и в кейсе);
#   color — цвет названия и салюта префикса (сам ник не красится);
#   file  — иконка из ресурспака: items/<file>.json и textures/item/<file>.png
#           (комплект pref1.png … pref10.png; свои картинки кладите рядом и меняйте file).
#
# НОМЕР префикса берётся из имени картинки: файл pref1 — №1, pref12 — №12.
# Поэтому номер всегда совпадает с картинкой, которую видит игрок, и не сдвигается,
# если запись переставить или добавить новую выше. У картинки без цифр
# (file: snowflake) номер — первый свободный по порядку.
# По номеру префикс выдают и забирают администраторы (all — сразу все префиксы):
#   /profile prefix give|take <ник> <номер|all>
#   /profile prefix list <ник>
# Кейсы выдаёт: /profile case prefix give <ник>
#
# ПАКИ префиксов лежат в plugins/f8-plugin/content/prefixpacks/*.yml и перечисляют
# только файлы отсюда: имя, цвет и анимация берутся из этого файла по полю file,
# поэтому новый префикс достаточно описать здесь один раз.
#
# АНИМАЦИЯ (смена картинок). У префикса можно перечислить несколько картинок,
# которые сменяют друг друга по кругу, и интервал в СОТЫХ СЕКУНДЫ:
#
#   pref9:
#     name: 'Аврора'
#     color: '#7FF0D2'
#     file: pref9
#     animation:
#       frames: [pref9, pref11, pref12]     # порядок кадров; можно и без animation.frames: animation: [pref9, pref11]
#       interval-hundredths: 8              # 8 сотых = 0,08 с на кадр; 10 = 0,1 с; 100 = 1 с
#
# Правила простые:
#   • один кадр или пустой список — обычная статичная картинка (file);
#   • кадр держится не меньше одного тика сервера (0,05 с), больше 60 с — не имеет смысла;
#   • кадры — такие же имена картинок из ресурспака (pref1 … pref10 в комплекте).
#     Для новых кадров нужен не только .png, но и строка в font/profile_ui.json:
#     файл pref11.png отвечает символу \ue110, pref12.png — \ue111 и так далее
#     (плагин считает глиф сам, в коде ничего менять не нужно);
#   • где видно анимацию: над головой (если включены profiles.overhead-tags), в tab,
#     в чате и в меню профиля — там кадр берётся на момент отрисовки. Сама картинка
#     — глиф шрифта, его двигает сервер: при смене кадра уходит одно обновление,
#     между кадрами трафика нет.
prefixes:
  pref1:
    name: 'Морозный'
    color: '#8FE3F5'
    file: pref1
  pref2:
    name: 'Закалённый'
    color: '#B9C3CE'
    file: pref2
  pref3:
