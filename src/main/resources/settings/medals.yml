# Медали: редкость, оформление и тексты выдачи.
# /profile medal reload применяет этот файл и data/medals/players/*.yml без перезапуска.
# В значениях сообщений поддерживается MiniMessage. Пример цвета: <green>текст</green>.
# Пустое сообщение '' отключает соответствующий текст.
# {player}, {rarity}, {title}, {count}, {error} подставляются как безопасный простой текст.
messages:
  public: '{player} получил <green>[{rarity}]</green>!'
  personal: '<green>Вы получили новую медаль!</green> Подробнее /profile.'
  given: '<gray>Медаль «{title}» добавлена игроку {player}.</gray>'
  taken: '<gray>У игрока {player} забрано медалей: {count}.</gray>'
  list: '<gold>Медали игрока {player}:</gold>'
  not-found: '<red>Медаль не найдена. Посмотрите /profile medal list.</red>'
  reloaded: '<green>Настройки и медали перезагружены.</green>'
  error: '<red>Изменение медалей не применено: {error}</red>'
  pending-error: '<red>Медаль пока не удалось записать. Право на неё сохранено; обратитесь к администратору.</red>'
  no-permission: '<red>Нет прав управлять медалями.</red>'

# Название медали всегда жирное. Градиент начинается с белого и заканчивается этим цветом.
# label — серая строка под особым названием; rarity — текст зелёных скобок в объявлении.
types:
  copper:
    label: 'Медная медаль'
    rarity: 'Медную медаль'
    gradient-end: '#CB8754'
  silver:
    label: 'Серебряная медаль'
    rarity: 'Серебряную медаль'
    # Стальной оттенок темнее белого: серебряный градиент остаётся различимым.
    gradient-end: '#71879F'
  gold:
    label: 'Золотая медаль'
    rarity: 'Золотую медаль'
    gradient-end: '#E6B94B'

# Только первая НОВАЯ победа над созвездием, как в 9.3. Заполненные разделы ниже
# включают автоматические медали за бутерброды. Эти значения используются при новой
# выдаче и переносе стандартной медали из 9.3.
# Уже выданные медали можно редактировать в medals/players/<UUID>.yml.
astronomy:
  title: 'Астрономия!'
  reasons:
    - 'Собрано 1 созвездие.'

# Автоматические медали за поедание бутербродов с икрой. Каждый вид достаточно
# съесть один раз; съеденные виды запоминаются в profiles/<UUID>.yml навсегда.
# Пока название или заслуги пустые, медаль НЕ выдаётся: впишите текст (и при
# желании metal: copper|silver|gold), затем выполните /profile medal reload.
# all-kinds: съедены все виды — красная, чёрная и ледяная икра.
# ice-caviar: съеден хотя бы один бутерброд с ледяной икрой.
sandwiches:
  all-kinds:
    metal: gold
    title: 'И это есть ваши деликатесы?'
    reasons:
    - 'Добыв красную икру, съешьте бутерброд с ней.'
    - 'Добыв черную икру, съешьте бутерброд с ней.'
    - 'Добыв ледяную икру, съешьте бутерброд с ней.'
  ice-caviar:
    metal: silver
    title: 'Поймай, обработай и... отравись?'
    reasons:
    - 'Поймайте особый предмет с рыбалки в зимних биомах - Заледеневшая изморозь.'
    - 'Добыв ледяную икру, съешьте бутерброд с ней.'

# ── Медали за напитки ──────────────────────────────────────────────────────
# Раздел называется napitki: (drinks: тоже понимается — если вам так привычнее).
# Недостающие строки плагин допишет сам при запуске, ваши тексты не тронет.
# Ключ — имя медали. Внутри обычные metal (copper|silver|gold), title, reasons.
#
# when: — условие выдачи:
#   drink-made          сделал напиток drink (по умолчанию drink = ключ медали),
#                       либо коктейль, в составе которого этот напиток есть;
#   flawless-alcohol    сделал алкогольный напиток БЕЗУПРЕЧНОГО качества (5 ступень бочки);
#   all-flawless-wines  сделал безупречные бутылки ВСЕХ видов вина (у которых в id есть wine);
#   rum-in-ocean        выпил ром, находясь в биоме океана;
#   drunk-max           дошёл до предела шкалы опьянения.
#
# drink: — id напитка из data/napitki/napitki.yml. Регистр и дефисы не важны,
#          одна опечатка в длинном id прощается (daquiri = daiquiri).
# alcohol: false — засчитывать и безалкогольный вариант напитка (по умолчанию нужен алкогольный).
# Пустые title и reasons отключают выдачу: медаль можно заготовить и заполнить позже.
# Ошибка в одной медали не отменяет остальные — напишем её в консоль при загрузке.
napitki:
  bezuprek:
    when: flawless-alcohol
    metal: gold
    title: 'Без упрёков.'
    reasons:
    - 'Найдите рецепт ЛЮБОГО алко-напитка.'
    - 'Сделайте алко-напиток ЛЮБОГО качества.'
    - 'Сделайте алко-напиток БЕЗУПРЕЧНОГО качества!'
  mead:
    when: drink-made
    drink: mead
    metal: copper
    title: 'Истинная медовуха.'
    reasons:
    - 'Сделайте алкогольную медовуху.'
  daquiri:
    when: drink-made
    drink: daiquiri
    metal: copper
    title: 'Истинный дайкири.'
    reasons:
    - 'Сделайте алкогольный дайкири.'
  pirat:
    when: rum-in-ocean
    metal: copper
    title: 'Я настоящий пират!'
    reasons:
    - 'Находясь в океане, выпейте пиратский ром.'
  vino-bezuprekALL:
    when: all-flawless-wines
    metal: gold
    title: 'Достойный?'
    reasons:
    - 'Сделайте ВСЕ ВИДЫ БЕЗУПРЕЧНОГО ВИНА!'
    - 'Получите респект от создателей сервера.'
    - 'Продолжайте).'
  buxlo:
    when: drunk-max
    metal: copper
    title: 'Всему нужно знать меру.'
    reasons:
    - '"Набухайтесь" до предела.'
