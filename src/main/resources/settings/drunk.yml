# Опьянение: невидимая шкала у каждого игрока и всё, что с ней происходит.
# Файл лежит в папке плагина: plugins/f8-plugin/settings/drunk.yml
# Применяется командой /f8 reload — перезапуск не нужен.
#
# ── ЧТО ЭТО ─────────────────────────────────────────────────────────────────
# Каждый глоток вина или рома добавляет игроку единицы опьянения. Сколько именно —
# написано НЕ здесь, а в data/napitki/napitki.yml, у каждого напитка своё значение
# на каждое качество выдержки (ром 4–8 за глоток, вино 2–5).
#
# Здесь — общие правила: размер шкалы, как быстро трезвеют и что вообще включать.
# Сами стадии (от «навеселе» до «отключки») и их эффекты — таблица в коде, её
# описание есть в docs/OPJANENIE.md. Файл не должен превращаться в программу,
# поэтому порогов и списков зелий тут нет.
#
# ── СТАДИИ КОРОТКО (шкала 50) ───────────────────────────────────────────────
#   1–7    Навеселе     поглощение, «море по колено» (падение почти не бьёт)
#   8–16   Разговорило  сила, речь плывёт
#   17–26  Шатает       сопротивляемость, тошнота пульсами, покачивание
#   27–36  Укачало      приступы тошноты: фантомные блоки и лужи
#   37–45  В стельку    сила, тошнота II, ведёт в стороны, роняет предметы
#   46–49  Край         слепота пульсами, шум в глазах
#   50     Отключка     темнота на 4 секунды, просыпается с половиной шкалы
#
# ── ПОХМЕЛЬЕ ────────────────────────────────────────────────────────────────
# После отключки, после сна сильно пьяным и после молока на «в стельку»:
# минуту тошнит, слабость и замедление. Молоко и вода сокращают.
drunk:
  # Размер шкалы. Пороги стадий пересчитываются сами: 30 из 60 — это те же
  # «25 из 50», то есть «Шатает».
  scale: 50

  # Сколько тиков идёт одна единица затухания: 200 тиков = 10 секунд.
  # Полная шкала (50) при этом трезвеет примерно за 8 минут.
  decay-ticks: 200

  # Похмелье после сильной пьянки.
  hangover: true

  # Пьяная речь в чате: переставленные буквы, «ик…», иногда одно многоточие.
  # Команды и личные сообщения не трогаются.
  slurred-chat: true

  # Шатание: подталкивание в случайную сторону на стадиях «Шатает» и выше.
  wobble: true

  # Фантомные блоки при тошноте: настоящие сущности-блоки, которые летят,
  # разлетаются частицами и исчезают. В мир ничего не ставится.
  phantom-blocks: true

  # Лужи: настоящие блоки (ил, слизь), которые плагин ставит у ног и убирает сам.
  # Ставятся только на природный пол (natural-floor ниже) и только в пустое место,
  # поэтому на постройках луж не будет. Старый блок запоминается и возвращается.
  puddles: true
  puddles-seconds: 60
  puddles-max: 120
  puddle-materials: [MUD, SLIME_BLOCK]

  # «Природный пол» под лужу. Досок, кирпича, стекла и прочих построек здесь нет
  # намеренно: чужие постройки плагин не пачкает.
  natural-floor: [DIRT, GRASS_BLOCK, COARSE_DIRT, ROOTED_DIRT, PODZOL, MYCELIUM, MUD,
                  MOSS_BLOCK, SAND, RED_SAND, GRAVEL, CLAY, STONE, DEEPSLATE,
                  SOUL_SAND, SOUL_SOIL, TUFF, SNOW_BLOCK, PACKED_MUD]

  # Творческий режим не пьянеет (удобно для строителей). Наблюдатели — тоже.
  ignore-creative: true

  # Как часто накатывает приступ тошноты на «Укачало» и выше: 1200–1800 тиков
  # (60–90 секунд).
  puke-min-ticks: 1200
  puke-max-ticks: 1800

  # Сколько фантомных блоков может летать одновременно (защита от просадок).
  phantom-max: 8
