# /profile medal reload применяет этот файл и medals/players/*.yml без перезапуска.
# В значениях сообщений поддерживается MiniMessage. Пример цвета: <green>текст</green>.
# Пустое сообщение '' отключает соответствующий текст.
# {player}, {rarity}, {title}, {count}, {error} подставляются как безопасный простой текст.
messages:
  public: '{player} получил <green>[{rarity}]</green>!'
  personal: 'Вы получили новую медаль! Подробнее /profile.'
  given: '<gray>Медаль «{title}» добавлена игроку {player}.</gray>'
  taken: '<gray>У игрока {player} забрано медалей: {count}.</gray>'
  list: '<gold>Медали игрока {player}:</gold>'
  not-found: '<red>Медаль не найдена. Посмотрите /profile medal list.</red>'
  reloaded: '<green>Настройки и медали перезагружены.</green>'
  error: '<red>Изменение медалей не применено: {error}</red>'
  pending-error: '<red>Медаль пока не удалось записать. Право на неё сохранено; обратитесь к администратору.</red>'
  no-permission: '<red>Нет прав управлять медалями.</red>'

# Название медали всегда жирное. Градиент начинается с белого и заканчивается этим цветом.
# label — серая строка под особым названием; rarity — текст зелёных скобок в объявлении.
types:
  copper:
    label: 'Медная медаль'
    rarity: 'Медную медаль'
    gradient-end: '#CB8754'
  silver:
    label: 'Серебряная медаль'
    rarity: 'Серебряную медаль'
    # Стальной оттенок темнее белого: серебряный градиент остаётся различимым.
    gradient-end: '#71879F'
  gold:
    label: 'Золотая медаль'
    rarity: 'Золотую медаль'
    gradient-end: '#E6B94B'

# Только первая НОВАЯ победа над созвездием, как в 9.3. Других автоматических медалей нет.
# Эти значения используются при новой выдаче и переносе стандартной медали из 9.3.
# Уже выданные медали можно редактировать в medals/players/<UUID>.yml.
astronomy:
  title: 'Астрономия!'
  reasons:
    - 'Собрано 1 созвездие.'
