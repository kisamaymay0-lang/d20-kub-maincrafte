name: Build Minecraft Plugin

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    - name: Build with Maven
      id: maven
      shell: bash
      run: |
        set +e
        mvn clean package > mvn-build.log 2>&1
        code=$?
        echo "exit_code=$code" >> "$GITHUB_OUTPUT"
        cat mvn-build.log
        exit 0

    - name: Report Maven errors to PR
      if: always() && steps.maven.outputs.exit_code != '0'
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          const log = fs.readFileSync('mvn-build.log', 'utf8');
          const lines = log.split('\n').filter(l =>
            /ERROR|error:|BUILD FAILURE|\.java:\[|\.java:\d/.test(l)
          );
          const pr = context.payload.pull_request;
          const body = '### ❌ Сборка упала\n\n```\n' +
            lines.slice(0, 80).join('\n') + '\n```';
          if (pr && pr.number) {
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              body
            });
          }

    - name: Fail on Maven error
      if: steps.maven.outputs.exit_code != '0'
      run: exit 1

    - name: Upload Artifact
      if: steps.maven.outputs.exit_code == '0'
      uses: actions/upload-artifact@v4
      with:
        name: AdaptationPlugin-Jar
        path: target/*.jar
