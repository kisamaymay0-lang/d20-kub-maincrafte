name: Build Minecraft Plugin

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    - name: Validate resource pack
      run: python3 scripts/build_resourcepack.py --check

    # Готовый пак, который уходит игрокам вместе с банкой. Проверяем то, что
    # ломалось по факту: pack.mcmeta в корне архива, определения предметов
    # косметики, живой JSON и отсутствие блок-стейта узорчатой вазы.
    - name: Validate shipped resource pack
      run: |
        python3 - <<'PY'
        import json, sys, zipfile

        archive = zipfile.ZipFile("docs/f8resurspack-fixed.zip")
        names = archive.namelist()
        problems = []
        if "pack.mcmeta" not in names:
            problems.append("pack.mcmeta must sit at the archive root")
        blobs = {n: archive.read(n) for n in names}
        for name, blob in blobs.items():
            if name.endswith(".json"):
                try:
                    json.loads(blob)
                except ValueError as error:
                    problems.append(f"{name}: {error}")

        def model_exists(ref):
            if ref.startswith("minecraft:"):
                return True
            namespace, _, path = ref.partition(":")
            return f"assets/{namespace}/models/{path}.json" in blobs

        for name in [n for n in names if n.startswith("assets/f8resurs/items/")]:
            model = json.loads(blobs[name]).get("model", {}).get("model", "")
            if not model_exists(model):
                problems.append(f"{name}: missing model {model}")
        for name in [n for n in names if n.startswith("assets/f8resurs/models/")]:
            model = json.loads(blobs[name])
            parent = model.get("parent", "")
            if parent and not model_exists(parent):
                problems.append(f"{name}: missing parent {parent}")
            for ref in model.get("textures", {}).values():
                if isinstance(ref, str) and ref.startswith("f8resurs:"):
                    texture = "assets/f8resurs/textures/" + ref.split(":", 1)[1] + ".png"
                    if texture not in blobs:
                        problems.append(f"{name}: missing texture {texture}")

        for item in ("kosmetika1", "kosmetika2", "kosmetika3"):
            if f"assets/f8resurs/items/{item}.json" not in blobs:
                problems.append(f"missing item definition: {item}")
        if "assets/minecraft/blockstates/decorated_pot.json" in blobs:
            problems.append("decorated_pot blockstate must not ship: the pot body "
                            "is drawn by a block entity renderer")
        if problems:
            print("\n".join(problems))
            sys.exit(1)
        print(f"OK: shipped pack has {len(names)} files")
        PY

    - name: Build with Maven
      id: maven
      shell: bash
      run: |
        set +e
        mvn --batch-mode clean verify > mvn-build.log 2>&1
        code=$?
        echo "exit_code=$code" >> "$GITHUB_OUTPUT"
        cat mvn-build.log
        exit 0

    - name: Report unit tests
      if: steps.maven.outputs.exit_code == '0'
      shell: bash
      run: |
        python3 - <<'PYTEST'
        import os
        import xml.etree.ElementTree as ET
        from pathlib import Path
        reports = list(Path('target/surefire-reports').glob('TEST-*.xml'))
        assert reports, 'Maven succeeded but no unit test reports were produced'
        counts = dict.fromkeys(('tests', 'failures', 'errors', 'skipped'), 0)
        for report in reports:
            suite = ET.parse(report).getroot()
            for key in counts:
                counts[key] += int(suite.get(key, 0))
        summary = ', '.join(f'{key}={value}' for key, value in counts.items())
        print(f'::notice title=Unit tests::{summary}')
        with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as output:
            output.write('### Unit tests (no Minecraft server)\n' + summary + '\n')
        assert counts['tests'] > 0 and counts['failures'] == counts['errors'] == 0
        PYTEST

    - name: Emit Maven errors as annotations
      if: always() && steps.maven.outputs.exit_code != '' && steps.maven.outputs.exit_code != '0'
      shell: bash
      run: |
        grep -E "ERROR|error:|BUILD FAILURE|\.java:\[|\.java:[0-9]" mvn-build.log \
          | head -80 \
          | while IFS= read -r line; do
              printf '::error::%s\n' "$line" | sed -e 's/%/%25/g' -e 's/\r/%0D/g' -e 's/\n/%0A/g'
            done

    - name: Fail on Maven error
      if: steps.maven.outputs.exit_code != '0'
      run: exit 1

    - name: Upload Artifact
      if: steps.maven.outputs.exit_code == '0'
      uses: actions/upload-artifact@v4
      with:
        name: f8-plugin-10.27
        path: |
          target/*.jar
          docs/f8resurspack-fixed.zip
          docs/craftengine-blocks/**
