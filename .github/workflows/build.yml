name: Build Minecraft Plugin

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    - name: Validate resource pack
      run: python3 scripts/build_resourcepack.py --check

    - name: Build with Maven
      id: maven
      shell: bash
      run: |
        set +e
        mvn --batch-mode clean verify > mvn-build.log 2>&1
        code=$?
        echo "exit_code=$code" >> "$GITHUB_OUTPUT"
        cat mvn-build.log
        exit 0

    - name: Report unit tests
      if: steps.maven.outputs.exit_code == '0'
      shell: bash
      run: |
        python3 - <<'PYTEST'
        import os
        import xml.etree.ElementTree as ET
        from pathlib import Path
        reports = list(Path('target/surefire-reports').glob('TEST-*.xml'))
        assert reports, 'Maven succeeded but no unit test reports were produced'
        counts = dict.fromkeys(('tests', 'failures', 'errors', 'skipped'), 0)
        for report in reports:
            suite = ET.parse(report).getroot()
            for key in counts:
                counts[key] += int(suite.get(key, 0))
        summary = ', '.join(f'{key}={value}' for key, value in counts.items())
        print(f'::notice title=Unit tests::{summary}')
        with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as output:
            output.write('### Unit tests (no Minecraft server)\n' + summary + '\n')
        assert counts['tests'] > 0 and counts['failures'] == counts['errors'] == 0
        PYTEST

    - name: Emit Maven errors as annotations
      if: always() && steps.maven.outputs.exit_code != '' && steps.maven.outputs.exit_code != '0'
      shell: bash
      run: |
        grep -E "ERROR|error:|BUILD FAILURE|\.java:\[|\.java:[0-9]" mvn-build.log \
          | head -80 \
          | while IFS= read -r line; do
              printf '::error::%s\n' "$line" | sed -e 's/%/%25/g' -e 's/\r/%0D/g' -e 's/\n/%0A/g'
            done

    - name: Fail on Maven error
      if: steps.maven.outputs.exit_code != '0'
      run: exit 1

    - name: Upload Artifact
      if: steps.maven.outputs.exit_code == '0'
      uses: actions/upload-artifact@v4
      with:
        name: f8-plugin-9.2
        path: |
          target/*.jar
          f8resurs-resourcepack.zip
          docs/UPDATE-9.2.md
